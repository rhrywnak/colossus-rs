[workspace]
members = ["colossus-auth", "colossus-rag", "colossus-pdf", "colossus-extract", "colossus-graph"]
resolver = "2"

[workspace.dependencies]
axum = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
tracing = "0.1"
tokio = { version = "1", features = ["full"] }
